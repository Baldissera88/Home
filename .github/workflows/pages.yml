name: Web app

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages only accepts the default branch.
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site
        run: |
          mkdir _site
          cp -r web/. _site/
          rm -rf _site/test _site/README.md
          echo "export const VERSION = 'build ${{ github.run_number }} (${GITHUB_SHA::7})';" > _site/version.js
          # A new cache name makes phones fetch the new version instead of keeping the old one.
          sed -i "s/lommepenge-v1/lommepenge-${GITHUB_SHA::7}/" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
