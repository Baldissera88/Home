name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew assembleDebug
      - name: RPG tests (world screenshots + headless simulation)
        id: rpgtests
        continue-on-error: true
        timeout-minutes: 10
        run: ./gradlew :rpg:testDebugUnitTest --tests 'com.baldissera.rpg.GameRenderTest'
      - uses: actions/upload-artifact@v4
        with:
          name: victors-bricks-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: filuccas-klodser-apk
          path: filucca/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: skyggernes-dyb-apk
          path: rpg/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: squishy-crush-apk
          path: squish/build/outputs/apk/debug/*.apk
      - name: RPG UI screenshots
        id: uitests
        continue-on-error: true
        timeout-minutes: 8
        run: ./gradlew :rpg:testDebugUnitTest --tests 'com.baldissera.rpg.UiScreenTest'
      - name: Publish RPG screenshots to the branch
        if: always() && github.event_name == 'push'
        run: |
          if ! ls rpg/build/screens/*.jpg >/dev/null 2>&1; then
            echo "no screenshots (world: ${{ steps.rpgtests.outcome }}, ui: ${{ steps.uitests.outcome }})"
            exit 0
          fi
          shots=$(mktemp -d)
          cp rpg/build/screens/*.jpg "$shots/"
          wire=$(mktemp -d)
          cp rpg/build/screens3d/*.json "$wire/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the commit on top of the latest branch each attempt, so concurrent runs never conflict.
          for attempt in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git checkout -q -B publish-screens "origin/${GITHUB_REF_NAME}"
            mkdir -p rpg/screens
            rm -f rpg/screens/*.jpg
            cp "$shots"/*.jpg rpg/screens/
            mkdir -p rpg/screens3d
            rm -f rpg/screens3d/*.json
            cp "$wire"/*.json rpg/screens3d/ 2>/dev/null || true
            echo "world tests: ${{ steps.rpgtests.outcome }}, ui: ${{ steps.uitests.outcome }} @ ${GITHUB_SHA::7}" > rpg/screens/STATUS.txt
            git add -A rpg/screens rpg/screens3d
            git commit -q -m "[ci] RPG screenshots for ${GITHUB_SHA::7}" || exit 0
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "screenshot push failed"
      - name: Squishy Crush engine tests
        run: ./gradlew :squish:testDebugUnitTest
