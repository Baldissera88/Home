name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew assembleDebug
      - name: RPG tests (screenshots + headless simulation)
        id: rpgtests
        continue-on-error: true
        run: ./gradlew :rpg:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: victors-bricks-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: filuccas-klodser-apk
          path: filucca/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: skyggernes-dyb-apk
          path: rpg/build/outputs/apk/debug/*.apk
      - name: Print RPG screenshots
        if: always()
        run: |
          for f in rpg/build/screens/*.jpg; do
            [ -f "$f" ] || continue
            echo "@@IMG $(basename "$f")"
            base64 -w 0 "$f" | fold -w 3000
            echo
            echo "@@END"
          done
          echo "@@TESTS ${{ steps.rpgtests.outcome }}"
