<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d2c66">
<title>Coastline Run</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/": "./lib/addons/" } }
</script>
</head>
<body>

<!-- shared SVG icon sprites -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1a0"/><stop offset=".5" stop-color="#ffc928"/><stop offset="1" stop-color="#e58f00"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc3ff"/><stop offset="1" stop-color="#1f6fe0"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a5c"/><stop offset="1" stop-color="#d11d2a"/></linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8af06a"/><stop offset="1" stop-color="#2fae3c"/></linearGradient>
  </defs>
  <symbol id="i-shell" viewBox="0 0 32 32">
    <path d="M16 29 L9.5 25.5 C4 22.5 2 15.5 5 10 C7.6 5.4 12 3 16 3 C20 3 24.4 5.4 27 10 C30 15.5 28 22.5 22.5 25.5 Z" fill="url(#gGold)" stroke="#b46a00" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M16 27 V8 M16 27 L9 10.5 M16 27 L23 10.5 M16 27 L5.5 16 M16 27 L26.5 16" stroke="#cf8200" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M10 8 C12 6 14 5.4 16 5.4" stroke="#fff8c8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".9"/>
  </symbol>
  <symbol id="i-star" viewBox="0 0 32 32">
    <path d="M16 2.5l4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L16 23.4l-8.4 4.7 1.8-9.3L2.5 12.3l9.4-1.2z" fill="url(#gGold)" stroke="#b46a00" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-magnet" viewBox="0 0 32 32">
    <path d="M7 5v10a9 9 0 0 0 18 0V5" fill="none" stroke="#a5122a" stroke-width="8.5" stroke-linecap="butt"/>
    <path d="M7 5v10a9 9 0 0 0 18 0V5" fill="none" stroke="url(#gRed)" stroke-width="6.5" stroke-linecap="butt"/>
    <path d="M10 6v9a6 6 0 0 0 4 5.6" fill="none" stroke="#ffb0a6" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <rect x="3.2" y="2.5" width="7.6" height="7" rx="1" fill="#e9eef5" stroke="#8a97ab" stroke-width="1.2"/>
    <rect x="21.2" y="2.5" width="7.6" height="7" rx="1" fill="#e9eef5" stroke="#8a97ab" stroke-width="1.2"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 32 32">
    <path d="M16 2.5 4.5 6.5v8.5c0 7.2 4.6 11.7 11.5 14.5 6.9-2.8 11.5-7.3 11.5-14.5V6.5z" fill="url(#gBlue)" stroke="#124aa8" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M16 6.5 8.5 9v6.2c0 4.6 2.8 7.8 7.5 10.2z" fill="#fff" opacity=".25"/>
    <path d="M16 8.5l2 4.2 4.6.6-3.4 3.2.9 4.6-4.1-2.3-4.1 2.3.9-4.6-3.4-3.2 4.6-.6z" fill="url(#gGold)"/>
  </symbol>
  <symbol id="i-shoe" viewBox="0 0 32 32">
    <path d="M3 22.5c0-5 1.5-9 3-12.5l5 1.5c1 2.2 3.4 3.6 6.4 4.2 4.2.8 8.6 1.6 11 4.3 1 1.200.6 3-1 3H5c-1.100 0-2-.9-2-2.500z" fill="url(#gBlue)" stroke="#124aa8" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3 24.5h25.500v2.200H5z" fill="#fff" stroke="#9fb3d6" stroke-width="1"/>
    <path d="M12 14l3 3M15 16l3 3" stroke="#fff" stroke-width="1.800" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-run" viewBox="0 0 32 32">
    <circle cx="20" cy="6" r="3.2" fill="#ffd23c"/>
    <path d="M12 12.500l5-2.800 3.300 3 4.400 1.200M17 9.800l-2.400 7 4.600 3.400-1.800 7M14.600 16.800l-4.200 4.700-5 .5" fill="none" stroke="#ffb400" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 9h6M2 13h5" stroke="#ffd23c" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-jump" viewBox="0 0 32 32">
    <circle cx="16" cy="6" r="3.200" fill="#6fc3ff"/>
    <path d="M16 10v8M16 12l-7-3M16 12l7-3M16 18l-5 8M16 18l5 8" fill="none" stroke="#2f86e8" stroke-width="3.400" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-people" viewBox="0 0 32 32">
    <circle cx="11" cy="9" r="4.600" fill="currentColor"/><path d="M2.500 25c0-5 3.500-8.500 8.500-8.500S19.500 20 19.500 25z" fill="currentColor"/>
    <circle cx="22.500" cy="11" r="3.800" fill="currentColor" opacity=".8"/><path d="M20.500 17c5.500-.8 9 2.200 9 8h-8.500c0-3-.2-5.500-.5-8z" fill="currentColor" opacity=".8"/>
  </symbol>
  <symbol id="i-clip" viewBox="0 0 32 32">
    <rect x="5.500" y="5" width="21" height="24" rx="3.500" fill="currentColor"/>
    <rect x="11" y="2.500" width="10" height="6" rx="2" fill="currentColor" stroke="#0f2f6e" stroke-width="1.600"/>
    <path d="M10.500 17l3.200 3.200 7.300-7.600" fill="none" stroke="#0f2f6e" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-bag" viewBox="0 0 32 32">
    <path d="M5 11h22l-1.500 17H6.500z" fill="currentColor"/>
    <path d="M11 11V9a5 5 0 0 1 10 0v2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="19" r="3" fill="#0f2f6e"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 32 32">
    <path d="M13.600 2.500h4.800l.8 3.800 2.300 1 3.300-2.100 3.400 3.400-2.100 3.300 1 2.300 3.800.8v4.800l-3.800.8-1 2.300 2.100 3.300-3.400 3.400-3.300-2.100-2.300 1-.8 3.800h-4.800l-.8-3.800-2.300-1-3.300 2.100-3.400-3.400 2.100-3.300-1-2.300-3.800-.8v-4.800l3.800-.8 1-2.300-2.100-3.300 3.400-3.400 3.300 2.100 2.300-1z" fill="currentColor"/>
    <circle cx="16" cy="16" r="4.600" fill="#0f2f6e"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 32 32">
    <path d="M16 3 2.500 15.500h4V28h7v-8h5v8h7V15.500h4z" fill="currentColor"/>
  </symbol>
  <symbol id="i-board" viewBox="0 0 32 32">
    <path d="M4 12c2-4 6-5 9-5h14c2 0 2 3 0 4l-3 1.500 2 2.500c1 1.500 0 3-1.500 3H9c-2.500 0-5.500-2-5-6z" fill="currentColor"/>
  </symbol>
  <symbol id="i-bolt" viewBox="0 0 32 32">
    <path d="M18 2 6 18h8l-2 12 12-16h-8z" fill="currentColor"/>
  </symbol>
  <symbol id="i-share" viewBox="0 0 32 32">
    <path d="M16 3v16M10 9l6-6 6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 14H5v13h22V14h-2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<div id="app">
  <canvas id="c"></canvas>

  <!-- ====================== HUD ====================== -->
  <div id="hud" class="screen">
    <button class="pause-btn" id="btnPause" aria-label="Pause"><span></span><span></span></button>
    <div class="hud-right">
      <div class="pill score"><b class="mult" id="hudMult">x3</b><svg class="ic"><use href="#i-star"/></svg><span id="hudScore">000000</span></div>
      <div class="pill coins"><span id="hudCoins">0</span><svg class="ic"><use href="#i-shell"/></svg></div>
    </div>
    <div class="power" id="hudPower">
      <div class="power-row" id="powMagnet"><div class="power-ic red"><svg><use href="#i-magnet"/></svg></div><div class="seg" id="segMagnet"></div></div>
      <div class="power-row" id="powShield"><div class="power-ic blue"><svg><use href="#i-shield"/></svg></div><div class="seg" id="segShield"></div></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="hint" id="hint">Swipe &larr; &rarr; to change lane &middot; &uarr; jump &middot; &darr; slide</div>
  </div>

  <!-- ====================== TITLE ====================== -->
  <div id="title" class="screen">
    <button class="icon-btn gear" id="btnGear" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    <div class="logo-wrap">
      <div class="logo">
        <div class="l1" data-t="Coastline">Coastline</div>
        <div class="l2" data-t="Run">Run</div>
      </div>
      <div class="tag">New places. Bigger adventures.</div>
    </div>
    <div class="title-bottom">
      <button class="play-btn" id="btnPlay">Play</button>
      <div class="nav">
        <button data-go="chars"><svg><use href="#i-people"/></svg>Characters</button>
        <button data-go="missions"><svg><use href="#i-clip"/></svg>Missions</button>
        <button data-go="shop"><svg><use href="#i-bag"/></svg>Shop</button>
        <button data-go="settings"><svg><use href="#i-gear"/></svg>Settings</button>
      </div>
    </div>
  </div>

  <!-- ====================== CHARACTERS ====================== -->
  <div id="chars" class="screen sheet-light">
    <div class="sheet-head"><h2>Characters</h2><button class="x" data-go="title">&times;</button></div>
    <div class="char-info">
      <h3 id="charName">Luna</h3>
      <p id="charTag">Fast feet. Bigger dreams.</p>
      <div class="stats" id="charStats"></div>
      <button class="select-btn" id="btnSelect">Select</button>
    </div>
    <div class="avatars" id="avatars"></div>
    <div class="tabbar">
      <button class="on"><svg><use href="#i-people"/></svg>Characters</button>
      <button><svg><use href="#i-board"/></svg>Boards</button>
      <button><svg><use href="#i-bolt"/></svg>Upgrades</button>
    </div>
  </div>

  <!-- ====================== MISSIONS ====================== -->
  <div id="missions" class="screen sheet-dark">
    <div class="sheet-head"><h2>Missions</h2><button class="x" data-go="title">&times;</button></div>
    <div class="m-tabs"><button class="on">Daily</button><button>Story</button></div>
    <div class="m-list" id="missionList"></div>
    <div class="m-next">
      <div class="m-next-img"></div>
      <div class="m-next-txt"><small>Next region</small><b>Amalfi Coast</b><div class="bar"><i style="width:34%"></i><em>5 / 15</em></div></div>
      <div class="lock">&#128274;</div>
    </div>
  </div>

  <!-- ====================== GAME OVER / HIGH SCORE ====================== -->
  <div id="over" class="screen sheet-score">
    <button class="back" data-go="title">&larr;</button>
    <button class="share"><svg><use href="#i-share"/></svg></button>
    <div class="hs-title">High Score</div>
    <div class="hs-val"><svg class="ic"><use href="#i-star"/></svg><span id="overScore">125,430</span></div>
    <div class="hs-sub" id="overSub">New best!</div>
    <div class="board">
      <div class="b-tabs"><button class="on">Global</button><button>Friends</button></div>
      <div class="b-list" id="boardList"></div>
    </div>
    <button class="play-btn small" id="btnAgain">Play Again</button>
  </div>

  <!-- ====================== PAUSE ====================== -->
  <div id="pause" class="screen sheet-pause">
    <div class="pause-card">
      <h2>Paused</h2>
      <button class="play-btn small" id="btnResume">Resume</button>
      <button class="ghost-btn" id="btnQuit">Quit</button>
    </div>
  </div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
