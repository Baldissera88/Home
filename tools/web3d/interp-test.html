<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame interpolation test</title>
<style>
  :root { --bg: #fafafa; --fg: #1a1a1a; --ok: #1b7a3a; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #e0e0e0; --ok: #6fd08c; --bad: #ff8a80; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, monospace; }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<pre id="out"></pre>
<script type="module">
  // Feeds FrameInterpolator a synthetic game: Kotlin makes frames on its own vsync, postMessage delivers
  // them late with jitter (in order, and only while the page's main thread is free), some frames are
  // doubled or never sent, and the page samples on its own vsync. Everything moves at constant speed,
  // so every display frame should advance by the same amount. Compares showing the newest arrived frame
  // (the old engine) with the interpolator. Serve the repo root and open /tools/web3d/interp-test.html;
  // tools/web3d/interp-test.mjs runs it headlessly. Results land in window.result.
  import { FrameInterpolator } from '/rpg/src/main/assets/web/js/interp.js';

  const lines = [];
  const log = (s) => { lines.push(s); console.log(s); document.getElementById('out').textContent = lines.join('\n'); };

  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const T0 = 100;
  const HERO = { dir: [0.8, 0.6], speed: 4.5, at: [10, 10] };
  const ENEMY = { dir: [-0.6, 0.8], speed: 3, at: [30, 5] };
  const NPCW = { dir: [1, 0], speed: 1.2, at: [5, 20] };
  const LOOT = { dir: [0, 1], speed: 1.5, at: [12, 3] };
  const SHOT_V = 12, SHOT_EVERY = 0.6, SHOT_LIFE = 0.45;
  const YAW_RATE = 0.8;

  const along = (m, t, d) => +(m.at[d] + m.dir[d] * m.speed * t).toFixed(9);

  /** The game's state at game time t (s since start), as a Wire frame. */
  function frame(t, k, sc) {
    const q = sc.posDecimals == null ? (v) => v : (v) => Math.round(v * 100) / 100;
    const hx = q(along(HERO, t, 0)), hy = q(along(HERO, t, 1));
    const e = [];
    if (t < 3) e.push([5, 2, 40, 40, 0, 1, 0, 0, 0, 0, 1, 1, '']);
    e.push([7, 3, q(along(ENEMY, t, 0)), q(along(ENEMY, t, 1)), ENEMY.dir[0], ENEMY.dir[1], 1, 0, 0, 0, 1, 1, '']);
    e.push([9, 1, 44, 41, 1, 0, 0, 0, 0, 0, 1, 0.5, '']);
    const pr = [];
    const age = t % SHOT_EVERY;
    if (age < SHOT_LIFE) {
      const sx = along(HERO, t - age, 0), sy = along(HERO, t - age, 1);
      pr.push([q(sx + SHOT_V * age), q(sy), SHOT_V, 0, 0xffff8040 | 0, 0.3, 0]);
    }
    const f = {
      k: 'f', t: 0, dl: 1, rn: 0, fg: 0, fd: 0, cy: q(0.3 + YAW_RATE * t), sh: [0, 0], lf: 0,
      p: [hx, hy, HERO.dir[0], HERO.dir[1], 1, 0, 0, 0, 0, 1, 0, 0, -1, HERO.speed],
      e,
      n: [[2, 1, q(along(NPCW, t, 0)), q(along(NPCW, t, 1)), 1, 0, 1, '']],
      pr,
      lo: [[11, 0, q(along(LOOT, t, 0)), q(along(LOOT, t, 1)), 0.3, 0, 0, '5 gold']],
      pa: [1, 2, 0, 0.1, 0xffffffff | 0, 1, 0], tx: [[1, 1, '12', 0xffffffff | 0, 0, 0.1]], zo: [], me: [], bo: [], wa: [], dc: [], gh: [], pu: '00',
    };
    // Wire.n writes 2 decimals today; a newer Wire may send 4 plus a sequence number.
    f.t = sc.fine ? Math.round((T0 + t) * 1e4) / 1e4 : Math.round((T0 + t) * 100) / 100;
    if (sc.fine) f.fs = k;
    return f;
  }

  // What to measure on each displayed frame: [x, y] and the true motion per second along it.
  const PROBES = {
    hero: { get: (f) => [f.p[0], f.p[1]], m: HERO },
    enemy: { get: (f) => { for (const e of f.e) if (e[0] === 7) return [e[2], e[3]]; return null; }, m: ENEMY },
    npc: { get: (f) => [f.n[0][2], f.n[0][3]], m: NPCW },
    loot: { get: (f) => [f.lo[0][2], f.lo[0][3]], m: LOOT },
    shot: { get: (f) => (f.pr.length ? [f.pr[0][0], f.pr[0][1]] : null), m: { dir: [1, 0], speed: SHOT_V } },
    yaw: { get: (f) => [f.cy, 0], m: { dir: [1, 0], speed: YAW_RATE } },
  };

  /** Runs one scenario and returns step statistics for the raw stream and the interpolated one. */
  function run(sc) {
    const rand = rng(sc.seed || 1);
    const gameMs = 1000 / sc.gameHz, renderMs = 1000 / sc.renderHz;
    const dur = (sc.seconds || 20) * 1000;
    // Kotlin: frame k made at k * gameMs, posted, arriving after latency ± jitter, in order.
    const msgs = [];
    let lastArr = 0;
    for (let k = 0; k * gameMs < dur + 200; k++) {
      if (rand() < (sc.miss || 0)) continue;
      const made = k * gameMs;
      const copies = rand() < (sc.dup || 0) ? 2 : 1;
      for (let c = 0; c < copies; c++) {
        let at = made + sc.latency + (rand() * 2 - 1) * sc.jitter + c * 0.7;
        at = Math.max(at, lastArr);
        lastArr = at;
        msgs.push({ at, k, made });
      }
    }
    // The page: a vsync tick every renderMs; the main thread is busy for `busy` ms after each tick
    // (sometimes much longer: a hitch), and messages wait until it is free.
    const ip = new FrameInterpolator();
    const stats = {};
    for (const name in PROBES) stats[name] = { raw: acc(), interp: acc() };
    const delay = { raw: 0, interp: 0, n: 0 };
    let mi = 0, rawFrame = null, rawK = -1, tick = sc.phase || 0, free = 0, prevTick = -1;
    const prev = { raw: {}, interp: {} };
    while (tick < dur) {
      // Deliver what arrived before this tick (stamped when the main thread got to it).
      while (mi < msgs.length && Math.max(msgs[mi].at, free) <= tick) {
        const m = msgs[mi++];
        const at = Math.max(m.at, free);
        const f = frame(m.made / 1000, m.k, sc);
        ip.push(f, at);
        rawFrame = f;
        rawK = m.k;
      }
      if (rawFrame) {
        const out = ip.sample(tick);
        const dt = prevTick < 0 ? 0 : tick - prevTick;
        const warm = tick > 1000;
        for (const name in PROBES) {
          const pr = PROBES[name];
          measure(stats[name].raw, prev.raw, name, pr.get(rawFrame), pr.m, dt, warm, sc.renderHz);
          measure(stats[name].interp, prev.interp, name, pr.get(out), pr.m, dt, warm, sc.renderHz);
        }
        if (warm) {
          delay.raw += tick - (rawFrame.p[0] - HERO.at[0]) / (HERO.dir[0] * HERO.speed) * 1000;
          delay.interp += tick - (out.p[0] - HERO.at[0]) / (HERO.dir[0] * HERO.speed) * 1000;
          delay.n++;
        }
        prevTick = tick;
      }
      // Busy after the tick; a hitch now and then skips whole vsyncs.
      let busy = sc.busy || 0;
      if (rand() < (sc.hitch || 0)) busy = sc.hitchMs;
      free = tick + busy;
      tick += renderMs;
      while (tick < free) tick += renderMs;
    }
    const res = {};
    for (const name in stats) res[name] = { raw: done(stats[name].raw), interp: done(stats[name].interp) };
    res.delayMs = { raw: +(delay.raw / delay.n).toFixed(1), interp: +(delay.interp / delay.n).toFixed(1) };
    return res;
  }

  function acc() { return { n: 0, max: 0, sq: 0, repeats: 0, jumps: 0, devs: [] }; }

  function measure(s, prev, name, cur, m, dt, warm, hz) {
    const p = prev[name];
    if (cur && p && dt > 0 && warm) {
      const step = (cur[0] - p[0]) * m.dir[0] + (cur[1] - p[1]) * m.dir[1];
      const ideal = m.speed * dt / 1000;
      const unit = m.speed / hz;
      const dev = Math.abs(step - ideal) / unit;
      s.n++;
      s.sq += dev * dev;
      s.devs.push(dev);
      if (dev > s.max) s.max = dev;
      if (step < ideal * 0.25) s.repeats++;
      if (step > ideal * 1.75) s.jumps++;
    }
    prev[name] = cur ? [cur[0], cur[1]] : null;
  }

  function done(s) {
    const d = s.devs.sort((a, b) => b - a);
    const p99 = d.length ? d[Math.floor(d.length / 100)] : 0;
    return { max: +s.max.toFixed(3), p99: +p99.toFixed(3), rms: +Math.sqrt(s.sq / Math.max(1, s.n)).toFixed(3), repeats: s.repeats, jumps: s.jumps, n: s.n };
  }

  // ---------------------------------------------------------------- behaviour checks

  const checks = [];
  const check = (name, ok, info = '') => checks.push({ name, ok: !!ok, info });
  const sc0 = { fine: true };

  {
    // One frame, stepped many times (the screenshot harness): the frame itself, every time.
    const ip = new FrameInterpolator();
    const f = frame(0, 0, sc0);
    ip.push(f, 1000);
    let same = true;
    for (let i = 0; i < 200; i++) same = same && ip.sample(1000 + i * 33) === f;
    check('holds a single frame', same);
    check('null before any frame', new FrameInterpolator().sample(5) === null);
  }

  {
    // Shape: a blended frame has the keys and array layout of a Wire frame.
    const ip = new FrameInterpolator();
    for (let k = 0; k < 6; k++) ip.push(frame(k / 60, k, sc0), 1000 + k * 16.7);
    const raw = frame(4 / 60, 4, sc0);
    const out = ip.sample(1000 + 5 * 16.7);
    const keys = Object.keys(raw).sort().join() === Object.keys(out).sort().join();
    const rows = ['p', 'e', 'n', 'pr', 'lo'].every((k) => Array.isArray(out[k]) && out[k].length === raw[k].length
      && (k === 'p' || out[k].every((r, i) => Array.isArray(r) && r.length === raw[k][i].length)));
    const strs = out.e.every((r) => typeof r[12] === 'string') && out.lo[0][7] === '5 gold' && typeof out.pu === 'string';
    const between = out.p[0] > HERO.at[0] && out.p[0] < along(HERO, 5 / 60, 0) + 1e-9;
    const unit = Math.abs(Math.hypot(out.p[2], out.p[3]) - 1) < 1e-6;
    check('same shape as a Wire frame', keys && rows && strs, `keys ${keys} rows ${rows} strings ${strs}`);
    check('blends between frames, facing stays unit', between && unit, `x ${out.p[0].toFixed(3)}`);
  }

  {
    // A teleport (> 2.5 tiles) snaps; a short hop still blends.
    const ip = new FrameInterpolator();
    const a = frame(0, 0, sc0), b = frame(1 / 60, 1, sc0), c = frame(2 / 60, 2, sc0);
    c.p[0] = b.p[0] + 6;
    c.e[1][2] = b.e[1][2] + 1;
    ip.push(a, 0); ip.push(b, 16.7); ip.push(c, 33.4);
    let mid = false, hopBlends = false;
    for (let t = 16.7; t < 70; t += 2) {
      const o = ip.sample(t);
      const x = o.p[0];
      if (Math.abs(x - b.p[0]) > 0.5 && Math.abs(x - c.p[0]) > 0.5 && Math.abs(x - a.p[0]) > 0.5) mid = true;
      const ex = o.e[1][2];
      if (ex > b.e[1][2] + 0.1 && ex < c.e[1][2] - 0.1) hopBlends = true;
    }
    check('teleports snap, short moves blend', !mid && hopBlends);
  }

  {
    // A new level and a long stall start afresh: the first frame after shows as sent.
    const ip = new FrameInterpolator();
    for (let k = 0; k < 5; k++) ip.push(frame(k / 60, k, sc0), k * 16.7);
    ip.sample(80);
    ip.reset();
    const f = frame(0.1, 6, sc0);
    f.p[0] = 10.4;
    ip.push(f, 100);
    const lvl = ip.sample(101) === f;
    for (let k = 7; k < 12; k++) ip.push(frame(k / 60, k, sc0), 100 + (k - 6) * 16.7);
    ip.sample(200);
    const g = frame(1, 60, sc0);
    ip.push(g, 600);
    const stall = ip.sample(601) === g;
    check('level change and long stall snap', lvl && stall, `level ${lvl} stall ${stall}`);
  }

  {
    // Enemies match by uid even when one before them leaves the list.
    const ip = new FrameInterpolator();
    const t0 = 2.9;
    for (let k = 0; k < 12; k++) ip.push(frame(t0 + k / 60, k, sc0), k * 16.7);
    let worst = 0, last = null;
    for (let t = 20; t < 190; t += 4) {
      const o = ip.sample(t);
      const e = o.e.find((r) => r[0] === 7);
      if (last) worst = Math.max(worst, Math.abs(e[2] - last));
      last = e[2];
    }
    check('uid matching survives list changes', worst < 0.1, `largest step ${worst.toFixed(3)} tiles`);
  }

  {
    // Paused game: frames keep coming with the same time; nothing should drift.
    const ip = new FrameInterpolator();
    for (let k = 0; k < 4; k++) ip.push(frame(k / 60, k, {}), k * 16.7);
    const still = frame(3 / 60, 4, {});
    for (let k = 4; k < 60; k++) ip.push(frame(3 / 60, k, {}), k * 16.7);
    const o = ip.sample(60 * 16.7);
    check('paused game holds still', Math.abs(o.p[0] - still.p[0]) < 1e-6, `dx ${(o.p[0] - still.p[0]).toExponential(1)}`);
  }

  {
    // Allocation: blending a busy pair over and over should not grow the heap.
    const ip = new FrameInterpolator();
    const a = frame(0, 0, sc0), b = frame(1 / 60, 1, sc0);
    for (const f of [a, b]) for (let i = 0; i < 40; i++) f.e.push([100 + i, 2, 20 + i, 20, 1, 0, 1, 0, 0, 0, 1, 1, '']);
    ip.push(a, 0); ip.push(b, 16.7);
    for (let i = 0; i < 2e4; i++) ip.sample(16.7 + (i % 997) * 0.01);
    const mem = performance.memory;
    if (mem) {
      const before = mem.usedJSHeapSize;
      for (let i = 0; i < 2e5; i++) ip.sample(20 + (i % 997) * 0.01 + i * 1e-9);
      const grew = mem.usedJSHeapSize - before;
      check('no per-sample allocations', grew < 64 * 1024, `heap ${grew >= 0 ? '+' : ''}${(grew / 1024).toFixed(1)} KB over 200k blends`);
    }
  }

  // ---------------------------------------------------------------- smoothness

  const SCENARIOS = [
    { name: '60 Hz, ±6 ms jitter, 3% doubled, 3% missing, 2-decimal t (today\'s Wire)', gameHz: 60, renderHz: 60, latency: 4, jitter: 6, dup: 0.03, miss: 0.03, phase: 4, seed: 7 },
    { name: 'same, 4-decimal t + fs', gameHz: 60, renderHz: 60, latency: 4, jitter: 6, dup: 0.03, miss: 0.03, phase: 4, fine: true, seed: 7 },
    { name: 'separate vsyncs drifting (60 vs 59.94 Hz), ±6 ms, 4-decimal t', gameHz: 60, renderHz: 59.94, latency: 4, jitter: 6, dup: 0.02, miss: 0.02, fine: true, seed: 3 },
    { name: 'busy page: 9 ms per frame, 1% 45 ms hitches, ±6 ms, 2-decimal t', gameHz: 60, renderHz: 60, latency: 4, jitter: 6, dup: 0.02, miss: 0.02, busy: 9, hitch: 0.01, hitchMs: 45, phase: 2, seed: 11 },
    { name: '120 Hz phone, ±3 ms jitter, 4-decimal t + fs', gameHz: 120, renderHz: 120, latency: 3, jitter: 3, dup: 0.02, miss: 0.02, phase: 3, fine: true, seed: 5 },
    { name: 'as the first, with Wire\'s 2-decimal positions', gameHz: 60, renderHz: 60, latency: 4, jitter: 6, dup: 0.03, miss: 0.03, phase: 4, posDecimals: 2, seed: 7 },
  ];

  const results = [];
  log('Step deviation per display frame, in fractions of one ideal frame step (0 = perfectly even).');
  log('max / 99th percentile / rms, then repeated frames (moved < 1/4 step) and jumps (> 1.75 steps),');
  log('after a 1 s warm-up. Two missing frames in a row leave 50 ms without data: those make the max.\n');
  for (const sc of SCENARIOS) {
    const r = run(sc);
    results.push({ scenario: sc.name, ...r });
    log(sc.name);
    for (const name in PROBES) {
      const a = r[name].raw, b = r[name].interp;
      log(`  ${name.padEnd(5)} newest frame: ${a.max.toFixed(2)} / ${a.p99.toFixed(2)} / ${a.rms.toFixed(2)} rep ${String(a.repeats).padStart(3)} jump ${String(a.jumps).padStart(3)}`
        + `  | interpolated: ${b.max.toFixed(2)} / ${b.p99.toFixed(2)} / ${b.rms.toFixed(2)} rep ${b.repeats} jump ${b.jumps}`);
    }
    log(`  display delay behind the game (ms): newest ${r.delayMs.raw}, interpolated ${r.delayMs.interp}\n`);
  }

  // The headline numbers must clearly improve, and exact-position scenarios must be close to even.
  const head = results[0].hero, fine = results[1].hero;
  check('interpolation smooths the jittered stream', head.interp.max < head.raw.max * 0.5 && head.interp.rms < head.raw.rms * 0.3,
    `hero max ${head.raw.max} -> ${head.interp.max}, rms ${head.raw.rms} -> ${head.interp.rms}`);
  check('even steps with precise game time', fine.interp.p99 < 0.05 && fine.interp.max < 0.75, `hero p99 ${fine.interp.p99}, max ${fine.interp.max}`);
  check('even steps with 2-decimal game time', head.interp.p99 < 0.1 && head.interp.max < 0.75, `hero p99 ${head.interp.p99}, max ${head.interp.max}`);

  log('Checks');
  for (const c of checks) log(`  ${c.ok ? 'PASS' : 'FAIL'} ${c.name}${c.info ? '  (' + c.info + ')' : ''}`);
  const ok = checks.every((c) => c.ok);
  log(ok ? '\nALL PASS' : '\nSOME CHECKS FAILED');
  window.result = { ok, checks, results };
  window.done = true;
</script>
</body>
</html>
