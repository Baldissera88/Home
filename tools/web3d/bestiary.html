<!doctype html>
<html>
<head>
<meta charset="utf-8">
<base href="/rpg/src/main/assets/web/">
<title>Shadow Depths bestiary</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{"imports": {"three": "./lib/three.module.js", "three/addons/": "./lib/addons/"}}</script>
</head>
<body>
<script type="module">
  // Close-ups of the procedural desert creatures, side by side in several animation states, for model review:
  // /tools/web3d/bestiary.html?type=SCORPION&states=idle,walk,wind:0.8,strike:0.1,dead:0.6&yaw=0.5&pitch=0.35&dist=3
  // States: idle, walk, wind:<0..1>, strike:<seconds after the blow>, cast:<seconds into the cast>, dead:<seconds>, stun.
  import * as THREE from 'three';
  import { RoomEnvironment } from '/tools/web3d/node_modules/three/examples/jsm/environments/RoomEnvironment.js';
  import { desertCreature, desertTriangles } from './js/desert_creatures.js';
  const q = new URLSearchParams(location.search);
  const type = q.get('type') || 'SCORPION';
  const states = (q.get('states') || 'idle').split(',');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(q.get('bg') || 0x9fb6c8);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = +(q.get('env') || 1.1);
  scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x4a4030, 0.8));
  const sun = new THREE.DirectionalLight(0xfff4e0, 2.5);
  sun.position.set(3, 6, 4);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xc9a46a, roughness: 0.95 }));
  ground.receiveShadow = true;
  scene.add(ground);
  const gap = +(q.get('gap') || 1.2);
  const dt = 1 / 30;
  const list = [];
  states.forEach((st, i) => {
    const c = desertCreature(type, i + 1);
    const [name, arg] = st.split(':');
    const x = (i - (states.length - 1) / 2) * gap;
    c.root.position.set(x, 0, 0);
    scene.add(c.root);
    const s = { x, y: 0, moving: false, wind: 0, stunned: false, frozen: false, cast: false };
    const run = (sec, fn) => { for (let k = 0; k < Math.round(sec / dt); k++) { fn && fn(k); c.tick(dt, s); } };
    run(1.5);
    if (name === 'walk') { s.moving = true; run(1.3 + (+arg || 0), () => { s.y += dt * (+q.get('speed') || 1.2); }); }
    else if (name === 'wind') run((+arg || 0.8) * 0.6, (k) => { s.wind = Math.min(+arg || 0.8, (k + 1) * dt / 0.6); });
    else if (name === 'strike') { run(0.6, (k) => { s.wind = (k + 1) * dt / 0.6; }); s.wind = 0; run(+arg || 0.1); }
    else if (name === 'cast') { s.cast = true; c.tick(dt, s); s.cast = false; s.wind = 0; run(+arg || 0.3, (k) => { if (q.has('castwind')) s.wind = Math.min(1, (k + 1) * dt / 0.55); }); }
    else if (name === 'dead') { c.die(); for (let k = 0; k < Math.round((+arg || 0.6) / dt); k++) c.dead(dt); }
    else if (name === 'stun') { s.stunned = true; run(0.5); }
    c.root.position.z = 0;
    c.root.rotation.y = +(q.get('face') || 0);
    list.push(c);
  });
  const yaw = +(q.get('yaw') || 0.4), pitch = +(q.get('pitch') || 0.35), dist = +(q.get('dist') || 3.2), ty = +(q.get('ty') || 0.4);
  const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 40), innerWidth / innerHeight, 0.05, 100);
  camera.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, ty + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(0, ty, 0);
  renderer.render(scene, camera);
  console.log('[bestiary] ' + type + ': ' + desertTriangles(type) + ', draw calls ' + renderer.info.render.calls);
  window.done = true;
</script>
</body>
</html>
